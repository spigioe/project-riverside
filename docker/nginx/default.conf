server {
    listen 80;

    # Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE támogatás
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # A notifications/stream végpont hosszan (akár órákig) nyitva tartja a kapcsolatot.
        # A backend 25mp-enként küld egy ping kommentet, ami az alapértelmezett 60mp-es
        # proxy_read_timeout-ot amúgy sem futtatná le, de explicit hosszú timeout-tal
        # nem függünk a két érték hallgatólagos összjátékától.
        proxy_read_timeout 3600s;
    }
}
